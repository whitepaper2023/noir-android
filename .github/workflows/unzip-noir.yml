name: Unzip NOIR project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project and commit files
        run: |
          set -e
          unzip -o noir-android.zip
          shopt -s dotglob
          mv noir-android/* .
          rmdir noir-android
          rm -f noir-android.zip .github/workflows/unzip-noir.yml
          git config user.name "whitepaper2023"
          git config user.email "whitepaper2023@users.noreply.github.com"
          git add -f -A
          git status --short
          git commit -m "NOIR Android 1.0.0: on-device audit with Shizuku actions"
          git push
